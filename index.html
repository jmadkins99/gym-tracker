<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gym Tracker</title>
    <!-- Dumbbell mark in the app's accent purple (#6a5a8a — the .section-title
         colour). Inlined as a data URI rather than a favicon.ico file: no extra
         request, nothing to cache-bust, and SVG stays crisp at 16px in the tab
         and at any size a browser asks for. The two variants that lost a
         legibility test at 16px were thinner plates (vanished) and plates with
         inner collars (blurred into a smudge) — keep the mass. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%236a5a8a'%3E%3Crect x='2' y='4' width='7.5' height='24' rx='3'/%3E%3Crect x='22.5' y='4' width='7.5' height='24' rx='3'/%3E%3Crect x='9.5' y='12.5' width='13' height='7' rx='2.5'/%3E%3C/g%3E%3C/svg%3E">
    <!-- Local dev (python3 -m http.server) swaps the accent purple for amber, so
         a localhost tab is never confused with the live GitHub Pages tab beside
         it. Colour only — same mark, same 16px legibility. Rewriting the one
         attribute keeps a single source for the shape above. -->
    <script>
        if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
            var devIcon = document.querySelector("link[rel='icon']");
            if (devIcon) devIcon.setAttribute('href', devIcon.getAttribute('href').replace('%236a5a8a', '%23ff9500'));
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <link rel="stylesheet" href="css/styles.css?v=32">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="js/config.js?v=32"></script>
    <script type="text/babel" src="js/utils.js?v=32"></script>
    <script type="text/babel" src="js/firebaseConfig.js?v=32"></script>
    <script type="text/babel" src="js/firebaseInit.js?v=32"></script>
    <script type="text/babel" src="js/storageRepo.js?v=32"></script>
    <script type="text/babel" src="js/migrations.js?v=32"></script>
    <script type="text/babel" src="js/plateauLogic.js?v=32"></script>
    <script type="text/babel" src="js/components/BackupReminderModal.jsx?v=32"></script>
    <script type="text/babel" src="js/components/SettingsModal.jsx?v=32"></script>
    <script type="text/babel" src="js/components/EditWorkoutModal.jsx?v=32"></script>
    <script type="text/babel" src="js/components/DayBreakdownModal.jsx?v=32"></script>
    <script type="text/babel" src="js/components/WorkoutView.jsx?v=32"></script>
    <script type="text/babel" src="js/components/WeeklyView.jsx?v=32"></script>
    <script type="text/babel" src="js/components/App.jsx?v=32"></script>
</body>
</html>
