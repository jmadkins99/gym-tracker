<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Laid out at 0.75 zoom rather than 1:1.

         Everything in this app is sized in fixed px, so the layout viewport is
         the only thing that decides how dense the result reads. At
         initial-scale=1 a phone hands the page ~393 CSS px and the card fills
         it edge to edge; at 0.75 the layout viewport opens to ~524 px and the
         same fixed sizes land as the denser view the app was actually tuned
         on. Nothing inside the stylesheet needs to know.

         This started life as a per-site page zoom saved in Safari, which is
         invisible, does not travel between devices, and had localhost and the
         live site disagreeing on the same phone -- the live page was the one
         at 0.75 and localhost the one at 1:1, not the other way round. Baking
         it in makes it the norm on every device instead of a setting one
         browser happens to remember.

         A page zoom saved in Safari MULTIPLIES with this rather than replacing
         it, so any site still holding 75% has to be reset to 100% or it lands
         at 0.56.

         Side effect worth knowing: @media (max-height: 780px) below keys on the
         layout viewport, which is now ~1136 px tall on a phone, so the compact
         chrome it defines no longer fires there. That block is now effectively
         desktop-and-tablet-only. -->
    <meta name="viewport" content="width=device-width, initial-scale=0.75, maximum-scale=0.75, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gym Tracker</title>
    <!-- Dumbbell mark in the app's accent purple (#6a5a8a — the .section-title
         colour). Inlined as a data URI rather than a favicon.ico file: no extra
         request, nothing to cache-bust, and SVG stays crisp at 16px in the tab
         and at any size a browser asks for. The two variants that lost a
         legibility test at 16px were thinner plates (vanished) and plates with
         inner collars (blurred into a smudge) — keep the mass. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%236a5a8a'%3E%3Crect x='2' y='4' width='7.5' height='24' rx='3'/%3E%3Crect x='22.5' y='4' width='7.5' height='24' rx='3'/%3E%3Crect x='9.5' y='12.5' width='13' height='7' rx='2.5'/%3E%3C/g%3E%3C/svg%3E">
    <!-- Sets the day's accent custom properties on <html>. Must stay a plain
         script above the stylesheet: everything below is text/babel, which
         Babel transforms asynchronously, so a palette applied from there would
         flash the default purple before landing. -->
    <script src="js/accentColor.js?v=70"></script>
    <!-- Retint the mark to match the day. Local dev (python3 -m http.server)
         holds the favicon at white so a localhost tab is never confused with the
         live GitHub Pages tab beside it. White is the one tint that stays
         unambiguous now that the live favicon changes daily: it is not a hue at
         all, so no palette can ever drift into looking like it — which the old
         amber could not promise once warm colours are in play. Only the favicon
         is pinned — the UI itself still rotates on localhost, which is where you
         check a colour before it ships. Rewriting the one fill keeps a single
         source for the shape above. -->
    <script>
        (function () {
            var icon = document.querySelector("link[rel='icon']");
            if (!icon) return;
            var dev = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
            var tint = dev ? '#ffffff' : (window.accentColor && window.accentColor.paletteFor(new Date()).muted);
            if (tint) icon.setAttribute('href', icon.getAttribute('href').replace('%236a5a8a', '%23' + tint.slice(1)));
        }());
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <link rel="stylesheet" href="css/styles.css?v=70">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="js/config.js?v=70"></script>
    <script type="text/babel" src="js/utils.js?v=70"></script>
    <script type="text/babel" src="js/firebaseConfig.js?v=70"></script>
    <script type="text/babel" src="js/firebaseInit.js?v=70"></script>
    <script type="text/babel" src="js/storageRepo.js?v=70"></script>
    <script type="text/babel" src="js/migrations.js?v=70"></script>
    <script type="text/babel" src="js/plateauLogic.js?v=70"></script>
    <script type="text/babel" src="js/components/SettingsModal.jsx?v=70"></script>
    <script type="text/babel" src="js/components/EditWorkoutModal.jsx?v=70"></script>
    <script type="text/babel" src="js/components/TimeDetailsModal.jsx?v=70"></script>
    <script type="text/babel" src="js/components/DayBreakdownModal.jsx?v=70"></script>
    <script type="text/babel" src="js/components/ExerciseCard.jsx?v=70"></script>
    <script type="text/babel" src="js/components/SwipeDeck.jsx?v=70"></script>
    <script type="text/babel" src="js/components/WeeklyView.jsx?v=70"></script>
    <script type="text/babel" src="js/components/App.jsx?v=70"></script>
</body>
</html>
