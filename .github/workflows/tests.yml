# CI: the same headless suite the pre-push hook runs, on GitHub's machines.
# GitLab equivalent: a .gitlab-ci.yml with one `test` job.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push to the same branch cancels the run it makes stale.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest # ships Google Chrome at /usr/bin/google-chrome, which tests/lib/browser.js finds
    timeout-minutes: 20 # a hung Chrome would otherwise burn the 6-hour default
    steps:
      # tests/lib/paths.js looks for public-gym-app beside this repo, so check
      # both out as siblings under the workspace.
      - uses: actions/checkout@v5
        with:
          path: gym-tracker
      - uses: actions/checkout@v5
        with:
          repository: jmadkins99/public-gym-app
          path: public-gym-app

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Full suite, not --affected: a fresh runner has no tests/.coverage map,
      # and CI is the one place that should never trust a selection.
      - name: Run tests
        working-directory: gym-tracker/tests
        run: bash run.sh
