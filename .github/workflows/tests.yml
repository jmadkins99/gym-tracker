# CI/CD: the headless suite, split across four machines, then a deploy to
# GitHub Pages on main.
# GitLab equivalent: a .gitlab-ci.yml with `stages: [test, deploy]`, a test
# job using `parallel: 4`, and a `pages` job limited to the default branch.
#
# The suite runs on branches, not on the merge to main. The "protect main"
# ruleset only lets a PR merge when its branch is up to date with main and
# green, and a squash merge of an up-to-date branch puts exactly the tested
# files on main, so a second run there would test the same code again.
# GitLab gets the same guarantee from merge trains / merged results pipelines.
name: tests

# Every branch push, so a branch is green before its PR is opened. No
# pull_request trigger: the PR's check is the run already on its head commit,
# and adding one would test every change twice. The merge to main is a push too.
on:
  push:
    branches: ['**'] # branches only; tags don't run tests
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push to a branch cancels the run it makes stale. Never on main,
# where cancelling could stop a deploy halfway.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shard:
    name: shard ${{ matrix.shard }}
    # Skipped only for the merge push to main (see the top of the file). The
    # "Run workflow" button still tests main on demand.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: false # let every slice finish, so one run shows every failure
      matrix:
        shard: [1, 2, 3, 4] # add a number here to split further
    runs-on: ubuntu-latest # ships Google Chrome at /usr/bin/google-chrome, which tests/lib/browser.js finds
    timeout-minutes: 20 # a hung Chrome would otherwise burn the 6-hour default
    steps:
      # This repo alone: the public-app cases moved to public-gym-app's own
      # tests/ in Oct 2026, so nothing needs checking out beside it.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The full suite, sliced -- never --affected: a fresh runner has no
      # tests/.coverage map, and CI is the one place that should never trust
      # a selection.
      - name: Run tests
        working-directory: tests
        env:
          TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bash run.sh

  # The one check the "protect main" ruleset requires, so the shard count can
  # change without touching the ruleset. `always()` because a job skipped
  # after a failed shard would count as passing; this one has to fail instead.
  # The one skip it accepts is the merge push to main, where the shards are
  # skipped on purpose.
  test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          result="${{ needs.shard.result }}"
          merge_push="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
          [ "$result" = success ] || { [ "$merge_push" = true ] && [ "$result" = skipped ]; }

  deploy:
    needs: test
    # Spelled out rather than the implicit success(), which is murky about
    # skipped jobs further up the chain. !cancelled(), not always(): a
    # cancelled run must never deploy.
    if: ${{ !cancelled() && needs.test.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # The whole repo, as the old branch deploy served it. Hidden files
      # (.github, .gitattributes) are left out by the action.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deploy
