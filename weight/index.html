<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Laid out below 1:1 for the same reason as the workout page (see the
         long note on its viewport tag): every size here is a fixed px, so the
         layout viewport alone decides how dense the page reads, and at 1:1 a
         phone's ~393 CSS px makes it read zoomed in.

         Safari's saved per-site page zoom multiplies with initial-scale, so the
         script below measures the scale the page really got and corrects it
         back to TARGET, exactly as the workout page does. -->
    <meta name="viewport" content="width=device-width, initial-scale=0.75, maximum-scale=0.75, user-scalable=no">
    <script>
        // Hold the page at TARGET even when Safari has a page zoom saved for
        // the site. The scale actually applied is the device's width over the
        // layout viewport's width; screen width is untouched by page zoom, so
        // dividing the target back out of the measured product leaves Safari's
        // factor, and initial-scale is set to cancel it. Touch devices only; a
        // reading within 2% of the target is left alone.
        (function () {
            var TARGET = 0.75;
            var meta = document.querySelector('meta[name="viewport"]');
            if (!meta || !(navigator.maxTouchPoints > 0)) return;
            var landscape = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;
            var deviceWidth = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
            var layoutWidth = document.documentElement.clientWidth;
            if (!deviceWidth || !layoutWidth) return;
            var applied = deviceWidth / layoutWidth;
            if (Math.abs(applied / TARGET - 1) < 0.02) return;
            var scale = Math.max(0.5, Math.min(1.5, TARGET * TARGET / applied));
            scale = Math.round(scale * 1000) / 1000;
            meta.setAttribute('content', 'width=device-width, initial-scale=' + scale +
                ', maximum-scale=' + scale + ', user-scalable=no');
        }());
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Weight</title>
    <!-- A dial rather than the dumbbell. Same accent purple and the same mass
         test as the workout mark: a ring this thick plus one needle is the most
         that still resolves at 16px, and it has to be distinguishable from the
         dumbbell at that size because both tabs are usually open at once. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%236a5a8a' stroke-width='4.5' stroke-linecap='round'%3E%3Ccircle cx='16' cy='16' r='11.5'/%3E%3Cpath d='M16 16 L9.5 10.5'/%3E%3C/g%3E%3C/svg%3E">
    <!-- Same reasoning as the workout page: a plain script above the stylesheet,
         because everything below is text/babel and would flash the fallback
         purple before the day's palette landed. -->
    <script src="../js/accentColor.js?v=22"></script>
    <script>
        (function () {
            var icon = document.querySelector("link[rel='icon']");
            if (!icon) return;
            var dev = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
            var tint = dev ? '#ffffff' : (window.accentColor && window.accentColor.paletteFor(new Date()).muted);
            if (tint) icon.setAttribute('href', icon.getAttribute('href').replace('%236a5a8a', '%23' + tint.slice(1)));
        }());
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <link rel="stylesheet" href="../css/styles.css?v=63">
    <link rel="stylesheet" href="../css/weight.css?v=23">
</head>
<body>
    <div id="root"></div>

    <!-- utils.js is loaded whole for three things: the APP_NAMESPACE rule, the
         `storage` helper, and getMondayOfWeek. The namespace rule especially
         must not be copied — it is the one piece that has to agree between the
         two pages, and /gym-tracker/weight/ still contains '/gym-tracker/', so
         this page lands in the live namespace with no extra work. The rest of
         the file is workout-specific and simply goes uncalled; nothing in it
         touches config.js at the top level, so config.js is not loaded here. -->
    <script type="text/babel" src="../js/utils.js?v=63"></script>
    <!-- Sync, on the same terms as the workout page. Nothing here is
         weight-specific: firebaseInit stays silent in the gym-local namespace
         (so tests and localhost make no gstatic requests), and storageRepo
         picks localStorage or Firestore from the auth state. Auth itself is
         per-origin, so signing in on /gym-tracker/ has already signed this page
         in — there is no second sign-in to perform. storageRepo also reads the
         path to know it was booted from the weight page, which is what keeps
         this visit from running the workout log's first-sign-in import. -->
    <script type="text/babel" src="../js/firebaseConfig.js?v=22"></script>
    <script type="text/babel" src="../js/firebaseInit.js?v=22"></script>
    <script type="text/babel" src="../js/storageRepo.js?v=22"></script>
    <script type="text/babel" src="../js/weight/weightLogic.js?v=22"></script>
    <script type="text/babel" src="../js/weight/weightSeed.js?v=22"></script>
    <script type="text/babel" src="../js/weight/planLogic.js?v=23"></script>
    <script type="text/babel" src="../js/components/weight/StreakBadges.jsx?v=22"></script>
    <script type="text/babel" src="../js/components/weight/PlanSummary.jsx?v=22"></script>
    <script type="text/babel" src="../js/components/weight/CheckInView.jsx?v=22"></script>
    <script type="text/babel" src="../js/components/weight/WeightHistory.jsx?v=24"></script>
    <script type="text/babel" src="../js/components/weight/WeightSettingsModal.jsx?v=22"></script>
    <script type="text/babel" src="../js/components/weight/WeightApp.jsx?v=22"></script>
</body>
</html>
